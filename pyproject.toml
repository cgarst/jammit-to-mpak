[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jammit-to-mpak"
version = "0.1.0"
description = "Convert a Jammit song folder (.jcf) into a Music Pack (.mpak) file"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
jcf2mpak = "jammit_to_mpak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jammit_to_mpak = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
